
baseurl = "https://blog.popey.com/"
title = "Alan Pope's blog"
languageCode = "en-gb"
theme = "beautifulhugo"
#disqusShortname="popey"
enableGitInfo = true
paginate = 20

[Params]
    mainSections = ["post"]
    intro = true
    headline = "Alan Pope's blog"
    description = "A bit of personal space for writing"
    github = "https://github.com/popey/popey.com-blog"
    #twitter = "https://twitter.com/popey"
    email = "alan@popey.com"
    opengraph = true
    shareTwitter = true
    dateFormat = "Mon, Jan 2, 2006"
    #style = "dark"
    commit = "https://github.com/popey/popey.com-blog/tree/"
    [Params.author]
        name = "Alan Pope"
        website = "https://popey.me/"
        email = "alan@popey.com"

[Permalinks]
    post = "/:year/:month/:filename/"

